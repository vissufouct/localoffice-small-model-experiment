[project]
name = "localoffice-harness"
version = "0.1.0"
description = "Local, revision-safe artifact harness"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "psutil>=7,<8",
    "jsonschema>=4.26,<5",
    "pypdf>=5,<7",
    "pypdfium2>=4,<6",
    "pyyaml>=6,<7",
    "pillow>=11,<13",
]

[project.optional-dependencies]
mlx = ["mlx-lm>=0.29", "outlines==1.3.3"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "reportlab>=4,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["host/localoffice"]

[tool.pytest.ini_options]
pythonpath = ["host"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
